name: Mobile CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect mobile changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - 'shared/**'
              - '.github/workflows/mobile-ci.yml'

      - name: Skip info
        if: steps.changes.outputs.mobile != 'true'
        run: echo "No mobile changes detected. Skipping mobile checks."

      - name: Setup Node.js
        if: steps.changes.outputs.mobile == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.mobile == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.mobile == 'true'
        run: npm run lint

      - name: Test
        if: steps.changes.outputs.mobile == 'true'
        run: npm test
