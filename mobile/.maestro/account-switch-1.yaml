# Account switch, part 1 (local backend STOPPED): the seeded user creates a workout offline and logs out choosing
# "Zachowaj dane" (data stays on the device for that account). Part 2 runs with the backend up.
appId: com.gymgate.app
---
- launchApp
- openLink: "exp+gymgate://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_fab=1&disableOnboarding=1"
- tapOn:
    text: "Open"
    optional: true
- assertVisible: "Historia sesji"
- runFlow:
    when:
      visible:
        id: "bar-continue-workout"
    commands:
      - tapOn:
          id: "bar-continue-workout"
      - tapOn:
          id: "workout-delete"
      - tapOn: "Usuń"
- tapOn:
    id: "bar-new-workout"
- tapOn:
    id: "workout-name"
- inputText: "Pending keep"
- hideKeyboard
- tapOn:
    id: "workout-submit"
- assertVisible: "Czas trwania"
- tapOn:
    id: "bar-menu"
- tapOn:
    id: "drawer-logout"
- assertVisible: "Niewysłane zmiany"
- tapOn: "Zachowaj dane"
- assertVisible: "Zaloguj się do swojego konta"
