# Navigation through all five tabs via the bottom bar (3 tabs) and the drawer (all 5).
# Needs the seeded account (the list shows "Historia sesji"); Ustawienia is the real screen now.
appId: com.gymgate.app
---
- launchApp
- openLink: "exp+gymgate://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_fab=1&disableOnboarding=1"
- tapOn:
    text: "Open"
    optional: true
- assertVisible: "Historia sesji"
- tapOn:
    id: "bar-tab-exercises"
- assertVisible: "Ćwiczenia"
- tapOn:
    id: "bar-tab-stats"
- assertVisible: "Statystyki"
- tapOn:
    id: "bar-tab-trainings"
- assertVisible: "Historia sesji"
- tapOn:
    id: "bar-menu"
- assertVisible: "Wyloguj się"
- assertVisible: "Jan Kowalski"
- assertVisible: "test@gymgate.com"
- assertVisible: "GymGate v1.0.0"
- tapOn:
    id: "drawer-item-plans"
- assertVisible: "Plany"
- tapOn:
    id: "bar-menu"
- tapOn:
    id: "drawer-item-settings"
- assertVisible: "Profil i opcje"
- tapOn:
    id: "bar-menu"
- tapOn:
    id: "drawer-item-exercises"
- assertVisible: "Ćwiczenia"
- tapOn:
    id: "bar-menu"
- tapOn:
    id: "drawer-item-stats"
- assertVisible: "Statystyki"
- tapOn:
    id: "bar-menu"
- tapOn:
    id: "drawer-item-trainings"
- assertVisible: "Historia sesji"
