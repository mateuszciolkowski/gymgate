# Navigation through all five tabs via the bottom bar (3 tabs) and the drawer (all 5).
# Placeholders show their title on the tabs not built yet; Treningi shows the empty state.
appId: com.gymgate.app
---
- launchApp
- openLink: "exp+gymgate://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_fab=1&disableOnboarding=1"
- tapOn:
    text: "Open"
    optional: true
- assertVisible: "Brak ukończonych treningów"
- tapOn:
    id: "bar-tab-exercises"
- assertVisible: "Ćwiczenia"
- tapOn:
    id: "bar-tab-stats"
- assertVisible: "Statystyki"
- tapOn:
