openapi: "3.1.0"
info:
  title: GymGate API
  version: "1.0.0"
  description: |
    REST API dla aplikacji GymGate – strength training tracker.
    Wszystkie chronione endpointy wymagają nagłówka `Authorization: Bearer <token>`.
    Odpowiedzi sukcesu: `{ success: true, data: ... }`.
    Odpowiedzi błędu: `{ success: false, error: "..." }`.

servers:
  - url: http://localhost:3000
    description: Local dev
  - url: https://gymgate-api.up.railway.app
    description: Production (Railway)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MuscleGroup:
      type: string
      enum:
        [
          CHEST, BACK, SHOULDERS, BICEPS, TRICEPS, FOREARMS, ABS, OBLIQUES,
          LOWER_BACK, QUADS, HAMSTRINGS, GLUTES, CALVES, ADDUCTORS,
          HIP_FLEXORS, TRAPS, LATS, MIDDLE_BACK, NECK, FULL_BODY,
        ]

    PhotoStage:
      type: string
      enum: [START, MIDDLE, END]

    WorkoutStatus:
      type: string
      enum: [DRAFT, COMPLETED]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string, nullable: true }

    ExercisePhoto:
      type: object
      description: Wherever an exercise returns `photos`, they are ordered by photoStage — START, MIDDLE, END.
      properties:
        id: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        photoStage: { $ref: "#/components/schemas/PhotoStage" }
        photoUrl: { type: string }
        createdAt: { type: string, format: date-time }

    Exercise:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        muscleGroups:
          type: array
          items: { $ref: "#/components/schemas/MuscleGroup" }
        description: { type: string, nullable: true }
        creatorUserId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        photos:
          type: array
          items: { $ref: "#/components/schemas/ExercisePhoto" }
        creator:
          nullable: true
          description: Twórca ćwiczenia (null dla ćwiczeń globalnych). Nigdy nie zawiera hasła ani innych pól użytkownika.
          type: object
          properties:
            id: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            email: { type: string, format: email }

    WorkoutSet:
      type: object
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        setNumber: { type: integer }
        weight: { type: number, format: double }
        repetitions: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkoutItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        workoutId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        orderInWorkout: { type: integer }
        notes: { type: string, nullable: true }
        previousNote: { type: string, nullable: true }
        exercise: { $ref: "#/components/schemas/Exercise" }
        sets:
          type: array
          items: { $ref: "#/components/schemas/WorkoutSet" }

    Workout:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        workoutDate: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/WorkoutStatus" }
        workoutName: { type: string, nullable: true }
        gymName: { type: string, nullable: true }
        location: { type: string, nullable: true }
        workoutNotes: { type: string, nullable: true }
        durationSeconds: { type: integer, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutItem" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExerciseUserStats:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        maxWeight: { type: number }
        maxWeightReps: { type: integer }
        maxWeightDate: { type: string, format: date-time }
        lastWeight: { type: number }
        lastReps: { type: integer }
        lastWorkoutDate: { type: string, format: date-time }
        totalWorkouts: { type: integer }
        lastNote: { type: string, nullable: true }

    StatsOverview:
      type: object
      properties:
        workoutsLastMonth: { type: integer }
        workoutsLastYear: { type: integer }
        totalSets: { type: integer }
        totalVolume: { type: number }

    WorkoutPlanItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        orderInPlan: { type: integer }
        exercise: { $ref: "#/components/schemas/Exercise" }

    WorkoutPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        creatorUserId: { type: string, format: uuid, nullable: true }
        isPublic: { type: boolean }
        isFavorite: { type: boolean, description: "True when the authenticated user has favorited this plan" }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkoutPlanItem" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisterBody:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        firstName: { type: string, minLength: 2 }
        lastName: { type: string, minLength: 2 }
        phone: { type: string }

    DeviceInfo:
      type: object
      properties:
        deviceId: { type: string, maxLength: 128, description: "Domyślnie 'unknown'" }
        deviceName: { type: string, maxLength: 100 }

    MobileSession:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        accessToken: { type: string, description: "JWT w formacie jak token PWA, ważny 1 godzinę" }
        accessTokenExpiresIn: { type: integer, example: 3600, description: sekundy }
        refreshToken: { type: string, description: "Losowy, ważny 180 dni od ostatniego użycia" }
        refreshTokenExpiresAt: { type: string, format: date-time }

    SyncOperation:
      type: object
      description: |
        Płaska operacja `{ opId, type, at, ...pola }`. `at` = czas zmiany na urządzeniu (serwer obcina
        przyszłość do własnego czasu). Typy i pola: `workout.create|update|complete|delete|skipPlanExercise`,
        `item.add|update|delete`, `set.add|update|delete`, `exercise.create|update|delete`,
        `plan.create|update|delete|duplicate|favorite|unfavorite` (szczegóły: `backend/src/modules/sync/API.md`).
      required: [opId, type, at]
      additionalProperties: true
      properties:
        opId: { type: string, maxLength: 64 }
        type: { type: string }
        at: { type: string, format: date-time }

    SyncOpResult:
      type: object
      required: [opId, status]
      properties:
        opId: { type: string }
        status: { type: string, enum: [applied, duplicate, superseded, rejected] }
        code: { type: string, description: "Tylko dla rejected: validation, not_found, forbidden, conflict, bad_request, stale_start, unknown_type" }
        error: { type: string }
        current: { nullable: true, description: "Stan rekordu na serwerze (rejected / superseded); null gdy brak lub niewidoczny" }

    SyncUpserts:
      type: object
      description: Płaskie wiersze dla lokalnej bazy klienta; `weight` jako ciąg dziesiętny, daty ISO.
      properties:
        workouts: { type: array, items: { type: object } }
        workoutItems: { type: array, items: { type: object } }
        workoutSets: { type: array, items: { type: object } }
        exercises: { type: array, items: { type: object } }
        plans: { type: array, items: { type: object }, description: "Z pozycjami `items: [{ id, exerciseId, orderInPlan }]` i `isFavorite`" }
        pendingNotes: { type: array, items: { type: object }, description: "Identyfikatorem notatki jest `exerciseId`" }
        profile: { type: object, nullable: true, description: "id, email, firstName, lastName, phone, isAdmin, activeWorkoutId" }

    SyncPullResponse:
      type: object
      properties:
        cursor: { type: string, nullable: true, description: "Nieprzezroczysty; null przy resyncRequired" }
        hasMore: { type: boolean }
        resyncRequired: { type: boolean }
        snapshotToken: { type: string, nullable: true, description: "Tylko strony snapshotu; null na ostatniej" }
        upserts: { $ref: "#/components/schemas/SyncUpserts" }
        deletes:
          type: array
          items:
            type: object
            properties:
              entity: { type: string, enum: [workout, workoutItem, workoutSet, exercise, plan, pendingNote] }
              id: { type: string }
        serverTime: { type: string, format: date-time }

    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }

  responses:
    MobileSession:
      description: Sesja mobilna
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              data: { $ref: "#/components/schemas/MobileSession" }

paths:
  # ── AUTH ──────────────────────────────────────────────────────────────────

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Rejestracja nowego użytkownika
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                firstName: { type: string }
                lastName: { type: string }
                phone: { type: string }
      responses:
        "201":
          description: Zarejestrowano
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
                      token: { type: string }
        "409": { description: Email już zajęty }
        "422": { description: Błąd walidacji }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Logowanie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Zalogowano
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
                      token: { type: string }
        "401": { description: Nieprawidłowe dane }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Dane zalogowanego użytkownika (z tokenu)
      security: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string, example: "Bearer <token>" }
      responses:
        "200":
          description: Dane użytkownika
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/User" }
        "401": { description: Brak lub wygasły token }

  /api/auth/account:
    delete:
      tags: [Auth]
      summary: Usuń konto i wszystkie dane użytkownika
      description: |
        Wymaga tokenu dostępu i potwierdzenia hasłem. Jedna transakcja: użytkownik, jego ćwiczenia,
        treningi (z pozycjami i seriami), statystyki, notatki oczekujące, plany (także publiczne;
        ulubione innych użytkowników znikają razem z planem, a ich treningi tracą `workoutPlanId`),
        ulubione, operacje synchronizacji i tokeny odświeżania. Ćwiczenia globalne i plany wbudowane
        zostają. Błędne hasło daje 403 (nie 401: klienty traktują 401 jako wygasłą sesję).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Konto usunięte
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { nullable: true }
        "400": { description: Brak hasła }
        "401": { description: Brak lub wygasły token albo użytkownik już nie istnieje }
        "403": { description: Nieprawidłowe hasło ("Nieprawidłowe hasło") albo konto chronione ("Tego konta nie można usunąć") }
        "429": { description: Zbyt wiele prób (ten sam limit co logowanie) }

  /api/auth/mobile/register:
    post:
      tags: [Auth]
      summary: Rejestracja z sesją mobilną
      description: Te same pola i komunikaty walidacji co `/api/auth/register`; zamiast 7-dniowego tokenu zwraca token dostępu (1 h) i token odświeżania (180 dni, przesuwany). Ten sam limit prób co logowanie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RegisterBody"
                - $ref: "#/components/schemas/DeviceInfo"
      responses:
        "201": { $ref: "#/components/responses/MobileSession" }
        "400": { description: Błąd walidacji }
        "409": { description: Email już zajęty }
        "429": { description: Zbyt wiele prób }

  /api/auth/mobile/login:
    post:
      tags: [Auth]
      summary: Logowanie z sesją mobilną
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [email, password]
                  properties:
                    email: { type: string, format: email }
                    password: { type: string }
                - $ref: "#/components/schemas/DeviceInfo"
      responses:
        "200": { $ref: "#/components/responses/MobileSession" }
        "400": { description: Błąd walidacji }
        "401": { description: Nieprawidłowy email lub hasło }
        "429": { description: Zbyt wiele prób }

  /api/auth/mobile/refresh:
    post:
      tags: [Auth]
      summary: Wymiana tokenu odświeżania (rotacja)
      description: |
        Zwraca nowy token dostępu i NOWY token odświeżania. Poprzedni token pozostaje ważny, dopóki
        nowy nie zostanie użyty po raz pierwszy (odporność na zgubioną odpowiedź). Użycie tokenu
        starszego niż poprzedni unieważnia całą rodzinę tokenów tego logowania.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MobileSession" }
        "400": { description: Brak tokenu }
        "401": { description: Token nieznany, wygasły, unieważniony albo użytkownik usunięty }

  /api/auth/mobile/logout:
    post:
      tags: [Auth]
      summary: Wylogowanie (unieważnienie rodziny tokenów odświeżania)
      description: Idempotentne; nieznany token też daje 200.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Wylogowano
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { nullable: true }
        "400": { description: Brak tokenu }

  # ── EXERCISES ─────────────────────────────────────────────────────────────

  /api/exercises:
    get:
      tags: [Exercises]
      summary: Lista ćwiczeń
      parameters:
        - in: query
          name: muscleGroup
          schema: { $ref: "#/components/schemas/MuscleGroup" }
        - in: query
          name: name
          schema: { type: string }
        - in: query
          name: creatorUserId
          schema: { type: string }
      responses:
        "200":
          description: Lista ćwiczeń
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Exercise" }
                  count: { type: integer }
    post:
      tags: [Exercises]
      summary: Utwórz ćwiczenie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, muscleGroups]
              properties:
                name: { type: string, maxLength: 200 }
                muscleGroups:
                  type: array
                  items: { $ref: "#/components/schemas/MuscleGroup" }
                  minItems: 1
                description: { type: string }
      responses:
        "201":
          description: Utworzone ćwiczenie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Exercise" }

  /api/exercises/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Exercises]
      summary: Pobierz ćwiczenie
      responses:
        "200":
          description: Ćwiczenie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Exercise" }
        "404": { description: Nie znaleziono }
    patch:
      tags: [Exercises]
      summary: Edytuj ćwiczenie
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                muscleGroups:
                  type: array
                  items: { $ref: "#/components/schemas/MuscleGroup" }
                description: { type: string }
      responses:
        "200":
          description: Zaktualizowane ćwiczenie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Exercise" }
        "403": { description: Ćwiczenie należy do innego użytkownika }
        "404": { description: Nie znaleziono }
    delete:
      tags: [Exercises]
      summary: Usuń ćwiczenie
      responses:
        "204": { description: Usunięto }
        "403": { description: Ćwiczenie należy do innego użytkownika }
        "404": { description: Nie znaleziono }

  # ── WORKOUTS ──────────────────────────────────────────────────────────────

  /api/workouts:
    get:
      tags: [Workouts]
      summary: Lista treningów użytkownika
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/WorkoutStatus" }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: offset
          schema: { type: integer }
      responses:
        "200":
          description: Lista treningów
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Workout" }
                  count: { type: integer }
    post:
      tags: [Workouts]
      summary: Utwórz nowy trening (DRAFT)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workoutDate: { type: string, format: date-time }
                workoutName: { type: string }
                gymName: { type: string }
                location: { type: string }
                workoutNotes: { type: string }
                workoutPlanId: { type: string, format: uuid }
                clientId:
                  type: string
                  maxLength: 64
                  description: >-
                    Opcjonalny ID wygenerowany po stronie klienta (offline-sync).
                    Dedupe po (userId, clientId) — retry po timeout/utracie
                    odpowiedzi zwraca istniejący trening zamiast tworzyć duplikat.
      responses:
        "201":
          description: Utworzony trening
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Workout" }

  /api/workouts/active:
    get:
      tags: [Workouts]
      summary: Aktywny trening użytkownika
      responses:
        "200":
          description: Aktywny trening lub null
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Workout" }
    delete:
      tags: [Workouts]
      summary: Wyczyść wskaźnik aktywnego treningu
      responses:
        "200": { description: Wyczyszczono }

  /api/workouts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Workouts]
      summary: Trening z items i sets
      responses:
        "200":
          description: Trening
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Workout" }
        "404": { description: Nie znaleziono }
    patch:
      tags: [Workouts]
      summary: Edytuj / zamknij trening
      description: |
        Gdy `status` jest zmieniony na `COMPLETED`, system automatycznie
        odbudowuje `ExerciseUserStats` dla wszystkich ćwiczeń w treningu.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workoutDate:
                  description: Pełny znacznik czasu ISO albo sama data `YYYY-MM-DD` (traktowana jako północ UTC).
                  oneOf:
                    - { type: string, format: date-time }
                    - { type: string, format: date, example: "2026-03-01" }
                status: { $ref: "#/components/schemas/WorkoutStatus" }
                workoutName: { type: string }
                gymName: { type: string }
                workoutNotes: { type: string }
                durationSeconds: { type: integer }
      responses:
        "200":
          description: Zaktualizowany trening
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Workout" }
    delete:
      tags: [Workouts]
      summary: Usuń trening (cascade + rebuild stats)
      responses:
        "200": { description: Usunięto }
        "404": { description: Nie znaleziono }

  /api/workouts/{workoutId}/exercises:
    post:
      tags: [WorkoutItems]
      summary: Dodaj ćwiczenie do treningu
      description: |
        Transakcja: pobiera ExercisePendingNote → tworzy WorkoutItem z previousNote →
        usuwa PendingNote → tworzy pierwszą serię (0 kg, 1 rep).
      parameters:
        - in: path
          name: workoutId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exerciseId]
              properties:
                exerciseId: { type: string, format: uuid }
                orderInWorkout: { type: integer }
                notes: { type: string }
                clientId:
                  type: string
                  maxLength: 64
                  description: >-
                    Opcjonalny ID wygenerowany po stronie klienta (offline-sync).
                    Dedupe po (workoutId, clientId) — retry po timeout/utracie
                    odpowiedzi zwraca istniejący item zamiast tworzyć duplikat.
      responses:
        "201":
          description: WorkoutItem z pierwszą serią
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/WorkoutItem" }

  /api/workouts/items/{itemId}:
    parameters:
      - in: path
        name: itemId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [WorkoutItems]
      summary: Edytuj WorkoutItem (notatki / kolejność)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderInWorkout: { type: integer }
                notes: { type: string, nullable: true }
      responses:
        "200":
          description: Zaktualizowany item
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/WorkoutItem" }
    delete:
      tags: [WorkoutItems]
      summary: Usuń ćwiczenie z treningu
      responses:
        "200": { description: Usunięto }

  /api/workouts/items/{itemId}/sets:
    post:
      tags: [WorkoutSets]
      summary: Dodaj serię do ćwiczenia
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weight, repetitions]
              properties:
                weight: { type: number, minimum: 0 }
                repetitions: { type: integer, minimum: 1 }
                setNumber: { type: integer }
                clientId:
                  type: string
                  maxLength: 64
                  description: >-
                    Opcjonalny ID wygenerowany po stronie klienta (offline-sync).
                    Dedupe po (itemId, clientId) — retry po timeout/utracie
                    odpowiedzi zwraca istniejącą serię zamiast tworzyć duplikat.
      responses:
        "201":
          description: Dodana seria
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/WorkoutSet" }

  /api/workouts/sets/{setId}:
    parameters:
      - in: path
        name: setId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [WorkoutSets]
      summary: Edytuj serię
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                weight: { type: number, minimum: 0 }
                repetitions: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Zaktualizowana seria
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/WorkoutSet" }
        "403": { description: Seria należy do innego użytkownika (nic nie jest zapisywane) }
        "404": { description: Seria nie istnieje }
    delete:
      tags: [WorkoutSets]
      summary: Usuń serię
      responses:
        "200": { description: Usunięto }

  # ── STATS ─────────────────────────────────────────────────────────────────

  /api/workouts/stats/all:
    get:
      tags: [Stats]
      summary: Wszystkie statystyki użytkownika (per ćwiczenie)
      responses:
        "200":
          description: Tablica ExerciseUserStats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ExerciseUserStats" }
                  count: { type: integer }

  /api/workouts/stats/exercise/{exerciseId}:
    get:
      tags: [Stats]
      summary: Statystyki dla konkretnego ćwiczenia
      parameters:
        - in: path
          name: exerciseId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ExerciseUserStats lub null (pierwsze wykonanie)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    oneOf:
                      - { $ref: "#/components/schemas/ExerciseUserStats" }
                      - { type: "null" }
                  message: { type: string }

  /api/workouts/stats/overview:
    get:
      tags: [Stats]
      summary: Globalny przegląd statystyk użytkownika
      responses:
        "200":
          description: StatsOverview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/StatsOverview" }

  /api/workouts/stats/progression/{exerciseId}:
    get:
      tags: [Stats]
      summary: Historyczna progresja ćwiczenia
      parameters:
        - in: path
          name: exerciseId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: metric
          schema:
            type: string
            enum: [maxSetWeight, volume]
            default: maxSetWeight
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Dane progresji
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      exerciseId: { type: string }
                      metric: { type: string }
                      points:
                        type: array
                        items:
                          type: object
                          properties:
                            workoutId: { type: string }
                            workoutDate: { type: string, format: date-time }
                            maxSetWeight: { type: number }
                            repetitionsAtMaxSet: { type: integer }
                            volume: { type: number }
                            value: { type: number }

  # ── USERS ─────────────────────────────────────────────────────────────────

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Pobierz użytkownika po ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dane użytkownika
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/User" }
        "404": { description: Nie znaleziono }

  # ── PLANS ─────────────────────────────────────────────────────────────────

  /api/plans:
    get:
      tags: [Plans]
      summary: Lista planów (z filtrem tab)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tab
          schema: { type: string, enum: [mine, builtin, community], default: mine }
      responses:
        "200":
          description: Lista planów
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutPlan" }
                  count: { type: integer }
    post:
      tags: [Plans]
      summary: Utwórz plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, exerciseIds]
              properties:
                name: { type: string, minLength: 3, maxLength: 100 }
                exerciseIds:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 50
                isPublic: { type: boolean, default: false }
      responses:
        "201":
          description: Plan utworzony
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/WorkoutPlan" }
        "400": { description: Błędne dane }
        "409": { description: Nazwa już istnieje }

  /api/plans/{id}:
    get:
      tags: [Plans]
      summary: Szczegóły planu
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/WorkoutPlan" }
        "404": { description: Nie znaleziono }
    put:
      tags: [Plans]
      summary: Aktualizuj plan (właściciel)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 3, maxLength: 100 }
                exerciseIds:
                  type: array
                  items: { type: string, format: uuid }
                isPublic: { type: boolean }
      responses:
        "200":
          description: Plan zaktualizowany
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/WorkoutPlan" }
        "403": { description: Brak uprawnień }
        "404": { description: Nie znaleziono }
    delete:
      tags: [Plans]
      summary: Usuń plan (właściciel)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Usunięto }
        "403": { description: Brak uprawnień }
        "404": { description: Nie znaleziono }

  /api/plans/{id}/duplicate:
    post:
      tags: [Plans]
      summary: Duplikuj plan (prywatna kopia)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Kopia planu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/WorkoutPlan" }
        "404": { description: Nie znaleziono }

  /api/plans/{id}/favorite:
    post:
      tags: [Plans]
      summary: Dodaj plan do ulubionych (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dodano do ulubionych
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "404": { description: Nie znaleziono lub niedostępny }
    delete:
      tags: [Plans]
      summary: Usuń plan z ulubionych (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Usunięto z ulubionych }
        "404": { description: Nie znaleziono }

  /api/plans/{id}/history:
    get:
      tags: [Plans]
      summary: Historia zmian planu (wersje od najnowszej)
      description: >
        Dostępne tylko dla osoby, która może edytować plan: autor, a dla planu wbudowanego admin.
        Plan bez zapisanych wersji zwraca swój obecny stan jako wersję 1.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lista wersji
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: integer, example: 2 }
                        name: { type: string }
                        shortName: { type: string, nullable: true }
                        isPublic: { type: boolean }
                        exercises:
                          type: array
                          description: Ćwiczenia w kolejności planu; nazwa skopiowana w chwili zmiany
                          items:
                            type: object
                            properties:
                              exerciseId: { type: string, format: uuid }
                              name: { type: string }
                        createdAt: { type: string, format: date-time }
        "403": { description: Brak uprawnień do edycji planu }
        "404": { description: Nie znaleziono }

  # ── SYNC (aplikacja mobilna) ──────────────────────────────────────────────

  /api/sync/push:
    post:
      tags: [Sync]
      summary: Wysyłka paczki operacji z urządzenia
      description: |
        Do 100 operacji, 60 żądań na minutę na użytkownika. Operacje wykonują się po kolei, każda we
        własnej transakcji; odrzucenie jednej nie przerywa pozostałych. Idempotentne po `opId`.
        Szczegóły i lista typów: `backend/src/modules/sync/API.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, ops]
              properties:
                deviceId: { type: string, maxLength: 128 }
                ops:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/SyncOperation" }
      responses:
        "200":
          description: Wynik dla każdej operacji
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      serverTime: { type: string, format: date-time }
                      results:
                        type: array
                        items: { $ref: "#/components/schemas/SyncOpResult" }
        "400": { description: Błędna koperta żądania }
        "429": { description: Zbyt wiele żądań }

  /api/sync/pull:
    get:
      tags: [Sync]
      summary: Pobranie danych (snapshot albo zmiany od kursora)
      description: |
        Bez parametrów: pierwsza strona snapshotu (ćwiczenia, plany z pozycjami i `isFavorite`, notatki
        oczekujące, profil z `activeWorkoutId`, pierwsze 200 treningów z pozycjami i seriami); `cursor` w
        odpowiedzi jest zapamiętany PRZED odczytem. Z `snapshotToken`: kolejna strona treningów.
        Z `cursor`: do 500 zmian; dla każdego zmienionego rekordu serwer zwraca jego AKTUALNY stan z
        punktu widzenia użytkownika (widoczny: upsert z pełnym wierszem; w przeciwnym razie: delete).
        Kursor `(txid, seq)` jest ograniczony przez xmin migawki PostgreSQL, więc zmiana z równolegle
        trwającej transakcji nigdy nie zostanie pominięta. Kursor wydany ponad 90 dni temu:
        `resyncRequired: true`. 60 żądań na minutę na użytkownika.
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: snapshotToken
          schema: { type: string }
      responses:
        "200":
          description: Strona danych
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/SyncPullResponse" }
        "400": { description: Nieprawidłowy kursor lub token, albo podane oba }
        "429": { description: Zbyt wiele żądań }
